#   docker compose up                       boot the API on http://localhost:3000
#   docker compose exec app bin/rails spec   run the test suite
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=postgres --dbname=library_development --quiet" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build:
      context: .
      target: development
    command: [ "bin/rails", "server", "-b", "0.0.0.0", "-p", "3000" ]
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RAILS_LOG_TO_STDOUT: "true"
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_cache:
